name: Protocol CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bufbuild/buf-setup-action@v1
      - name: Lint schema
        run: buf lint
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install generated-code tooling
        run: python -m pip install grpcio-tools==1.76.0 protobuf==6.33.5
      - name: Check generated Python and contract
        run: |
          python python/check_generated.py
          python python/test_team_icd.py

  cpp:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
